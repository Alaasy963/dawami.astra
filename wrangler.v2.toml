name = "dawami-v2"
main = "apps/api/index.ts"
compatibility_date = "2026-10-24"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dawami-v2-db"
database_id = "9d2b4a81-f894-487a-a611-281902bce949"
migrations_dir = "packages/db/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "c146a83c5b7f42ae8c51bdfbbbef62fc"

# Add the STORAGE binding after the account owner enables R2.
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "dawami-v2-storage"

[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "21001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PUNCH_LIMIT"
namespace_id = "21002"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
